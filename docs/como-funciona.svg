<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Cómo funciona Cati: tus archivos pasan por la vigilancia al índice local; tu frase se interpreta y se fusiona con el índice para dar los resultados">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f4f6f8; stroke: #d0d7de; stroke-width: 1.2; }
    .key { fill: #e7f6f3; stroke: #3fb8a6; stroke-width: 1.4; }
    .title { font: 600 15px -apple-system, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .note { font: 12.5px -apple-system, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #59636e; }
    .lane { font: 600 11px -apple-system, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #59636e; letter-spacing: .08em; }
    .wire { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .head { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; }
      .key { fill: #0f2a27; stroke: #3fb8a6; }
      .title { fill: #e6edf3; }
      .note, .lane { fill: #8d96a0; }
      .wire { stroke: #6e7681; }
      .head { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="400" rx="12"/>

  <text class="lane" x="28" y="34">EN SEGUNDO PLANO</text>

  <rect class="box" x="28" y="50" width="150" height="74" rx="10"/>
  <text class="title" x="44" y="80">Tus archivos</text>
  <text class="note" x="44" y="101">carpetas que eliges</text>

  <rect class="box" x="214" y="50" width="200" height="74" rx="10"/>
  <text class="title" x="230" y="80">Vigilancia</text>
  <text class="note" x="230" y="101">avisos del sistema al momento</text>
  <text class="note" x="230" y="117">y repaso cada 30 min</text>

  <rect class="box" x="450" y="28" width="220" height="56" rx="10"/>
  <text class="title" x="466" y="52">Nombres</text>
  <text class="note" x="466" y="71">buscables en menos de 1 s</text>

  <rect class="box" x="450" y="96" width="220" height="74" rx="10"/>
  <text class="title" x="466" y="120">Contenido</text>
  <text class="note" x="466" y="140">texto, PDF, OCR, fotos,</text>
  <text class="note" x="466" y="156">audio y vídeo</text>

  <rect class="box" x="450" y="182" width="220" height="56" rx="10"/>
  <text class="title" x="466" y="206">Modelo local</text>
  <text class="note" x="466" y="225">GPU por Vulkan o CPU</text>

  <rect class="key" x="712" y="96" width="220" height="74" rx="10"/>
  <text class="title" x="728" y="120">Índice en tu equipo</text>
  <text class="note" x="728" y="140">nombres, palabras</text>
  <text class="note" x="728" y="156">y significado</text>

  <path class="wire" d="M178 87 H210" marker-end="url(#arrow)"/>
  <path class="wire" d="M414 75 C432 75 432 56 446 56" marker-end="url(#arrow)"/>
  <path class="wire" d="M414 99 C432 99 432 133 446 133" marker-end="url(#arrow)"/>
  <path class="wire" d="M560 170 V178" marker-end="url(#arrow)"/>
  <path class="wire" d="M670 56 C692 56 692 118 708 118" marker-end="url(#arrow)"/>
  <path class="wire" d="M670 210 C692 210 692 148 708 148" marker-end="url(#arrow)"/>

  <line x1="28" y1="266" x2="932" y2="266" class="wire" stroke-dasharray="3 5" opacity=".6"/>
  <text class="lane" x="28" y="294">MIENTRAS ESCRIBES</text>

  <rect class="box" x="28" y="306" width="150" height="74" rx="10"/>
  <text class="title" x="44" y="336">Tu frase</text>
  <text class="note" x="44" y="357">«fotos de la playa»</text>

  <rect class="box" x="214" y="306" width="200" height="74" rx="10"/>
  <text class="title" x="230" y="336">Intérprete</text>
  <text class="note" x="230" y="357">tipo, fechas, tamaño,</text>
  <text class="note" x="230" y="373">lugar y erratas</text>

  <rect class="key" x="450" y="306" width="220" height="74" rx="10"/>
  <text class="title" x="466" y="336">Fusión</text>
  <text class="note" x="466" y="357">nombre + palabras +</text>
  <text class="note" x="466" y="373">significado, en milisegundos</text>

  <rect class="box" x="712" y="306" width="220" height="74" rx="10"/>
  <text class="title" x="728" y="336">Resultados</text>
  <text class="note" x="728" y="357">con vista previa real</text>

  <path class="wire" d="M178 343 H210" marker-end="url(#arrow)"/>
  <path class="wire" d="M414 343 H446" marker-end="url(#arrow)"/>
  <path class="wire" d="M670 343 H708" marker-end="url(#arrow)"/>
  <path class="wire" d="M822 170 V252 C822 280 560 270 560 302" marker-end="url(#arrow)"/>
</svg>
