name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: pip install "numpy>=2,<3" "Pillow>=11,<14"
      - name: Pruebas sin modelo
        run: python -m unittest -v tests.test_query
      - name: Sintaxis de todos los módulos
        run: python -m compileall -q cati scripts tests
