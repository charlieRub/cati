<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Cati</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f2430"/><stop offset="1" stop-color="#0e1014"/></linearGradient>
    <linearGradient id="ring" x1="110" y1="80" x2="430" y2="440" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6ee7d6"/><stop offset=".5" stop-color="#8aa8ff"/><stop offset="1" stop-color="#c49dff"/></linearGradient>
    <radialGradient id="lens" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#6ee7d6" stop-opacity=".28"/><stop offset=".6" stop-color="#6ee7d6" stop-opacity=".06"/><stop offset="1" stop-color="#6ee7d6" stop-opacity="0"/></radialGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#ffa95c"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)"/>
  <rect x="9.5" y="9.5" width="493" height="493" rx="110.5" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="3"/>
  <circle cx="232" cy="236" r="150" fill="#7fb8ff" opacity=".22" filter="url(#glow)"/>
  <!-- handle -->
  <path d="M338 342 L418 422" stroke="url(#ring)" stroke-width="52" stroke-linecap="round"/>
  <!-- ears fused with ring -->
  <path d="M118 182 L120 70 Q122 58 133 64 L222 112 Z" fill="url(#ring)"/>
  <path d="M346 182 L344 70 Q342 58 331 64 L242 112 Z" fill="url(#ring)"/>
  <circle cx="232" cy="236" r="128" fill="#12151b"/>
  <circle cx="232" cy="236" r="128" fill="url(#lens)"/>
  <circle cx="232" cy="236" r="128" fill="none" stroke="url(#ring)" stroke-width="36"/>
  <!-- cat eye inside lens -->
  <path d="M150 236 Q232 150 314 236 Q232 322 150 236 Z" fill="url(#iris)"/>
  <path d="M232 178 Q252 236 232 294 Q212 236 232 178 Z" fill="#12151b"/>
  <circle cx="258" cy="212" r="10" fill="#fff" opacity=".9"/>
  <path d="M150 196 A92 92 0 0 1 196 154" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="10" stroke-linecap="round"/>
</svg>
